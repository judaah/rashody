# Каждый пуш в main: тесты → сборка → выкладка на GitHub Pages.
# Упали тесты — выкладки нет, на телефоне остаётся прошлая версия.

name: Выкладка на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # приложение живёт по адресу https://<логин>.github.io/<репозиторий>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # адрес посредника обмена с партнёром (функция в Yandex Cloud); пусто — обмен выключен
          VITE_SYNC_URL: ${{ vars.SYNC_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
